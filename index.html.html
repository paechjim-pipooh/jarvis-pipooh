<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - AI Assistant for PIPOOH</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #020408;
            --primary-mint: #00ffcc;
            --primary-cyan: #00d8ff;
            --glow-mint: rgba(0, 255, 204, 0.4);
            --glow-cyan: rgba(0, 216, 255, 0.4);
            --panel-bg: rgba(6, 15, 25, 0.65);
            --panel-border: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-muted: #8ab4f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color) !important;
            font-family: 'Prompt', 'Orbitron', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 9:16 Aspect Ratio Frame Container */
        .app-viewport {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: radial-gradient(circle at center, #051329 0%, #020408 100%);
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Dynamic Starfield Canvas Background */
        #space-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 3D Hologram Orb Canvas */
        #hologram-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Top Header Navigation */
        .header-bar {
            position: relative;
            z-index: 10;
            padding: 15px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(180deg, rgba(2, 4, 8, 0.9) 0%, rgba(2, 4, 8, 0) 100%);
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
        }

        .system-subtext {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: var(--primary-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .user-greeting {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 10px var(--glow-mint);
        }

        .header-right-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .digital-clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-mint);
            text-shadow: 0 0 12px var(--glow-mint);
            line-height: 1;
        }

        .digital-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Center Orb Overlay Info */
        .orb-status-text {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            pointer-events: none;
        }

        .orb-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 20px var(--primary-mint), 0 0 40px var(--primary-cyan);
        }

        .orb-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--primary-cyan);
            margin-top: 5px;
            opacity: 0.8;
        }

        /* Central Mic Floating Action Button */
        .center-mic-container {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .mic-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,204,0.3) 0%, rgba(6,15,25,0.8) 100%);
            border: 2px solid var(--primary-mint);
            color: var(--primary-mint);
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px var(--glow-mint);
            transition: all 0.3s ease;
        }

        .mic-btn:hover, .mic-btn.listening {
            transform: scale(1.1);
            background: var(--primary-mint);
            color: #000;
            box-shadow: 0 0 45px var(--primary-mint);
        }

        /* Widgets Area Container (Calendar & Profile) */
        .widgets-section {
            position: absolute;
            bottom: 75px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .widget-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 12px;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.05);
        }

        .widget-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-cyan);
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 216, 255, 0.15);
            padding-bottom: 4px;
        }

        /* Avatar Hologram Card */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .avatar-ring {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--primary-mint);
            padding: 3px;
            box-shadow: 0 0 15px var(--glow-mint);
            position: relative;
            margin-bottom: 6px;
            overflow: hidden;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: top center;
            filter: contrast(1.05) brightness(1.05);
        }

        .profile-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }

        .profile-badge {
            font-size: 0.6rem;
            color: var(--primary-mint);
            background: rgba(0, 255, 204, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 2px;
        }

        /* Hologram Mini Calendar Widget */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.6rem;
        }

        .cal-day-head {
            color: var(--primary-cyan);
            font-weight: 600;
            padding-bottom: 2px;
        }

        .cal-date {
            color: #a0c4e8;
            padding: 3px 0;
            border-radius: 4px;
        }

        .cal-date.active {
            background: var(--primary-mint);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 8px var(--primary-mint);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(2, 4, 8, 0.95);
            border-top: 1px solid var(--panel-border);
            z-index: 20;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item i {
            font-size: 1.2rem;
            margin-bottom: 3px;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--primary-mint);
            text-shadow: 0 0 10px var(--glow-mint);
        }

        /* Modal Overlay for Settings */
        .settings-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 8, 0.9);
            z-index: 30;
            display: none;
            flex-direction: column;
            padding: 30px 20px;
            backdrop-filter: blur(15px);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-mint);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--primary-cyan);
            display: block;
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            background: rgba(6, 15, 25, 0.8);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- Background Starfield Canvas -->
        <canvas id="space-stars"></canvas>

        <!-- 3D Hologram Orb Canvas -->
        <div id="hologram-canvas"></div>

        <!-- Top Header Navigation -->
        <div class="header-bar">
            <div class="header-title-box">
                <span class="system-subtext">J.A.R.V.I.S. SYSTEM V5.2</span>
                <span class="user-greeting">สวัสดีครับ คุณ PIPOOH</span>
            </div>
            <div class="header-right-box">
                <div class="digital-clock" id="clock">00:00:00</div>
                <div class="digital-date" id="date">--/--/----</div>
            </div>
        </div>

        <!-- Center Floating Hologram Title -->
        <div class="orb-status-text">
            <div class="orb-title">J.A.R.V.I.S.</div>
            <div class="orb-subtitle">NEURAL AI MATRIX</div>
        </div>

        <!-- Main Interactive Microphone Button -->
        <div class="center-mic-container">
            <button class="mic-btn" id="micBtn" onclick="toggleVoiceRecognition()">
                <i class="fas fa-microphone"></i>
            </button>
        </div>

        <!-- Widgets Area: Profile Hologram & Dynamic Calendar -->
        <div class="widgets-section">
            <!-- PIPOOH Profile Hologram Card -->
            <div class="widget-card profile-container">
                <div class="widget-header">
                    <i class="fas fa-user-shield"></i> OPERATOR
                </div>
                <div class="avatar-ring">
                    <!-- รูปโปรไฟล์น้องพิกฟูห์ตัวจริง -->
                    <img src="S__67846157.jpg" alt="MR. PIPOOH" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?w=200&auto=format&fit=crop'">
                </div>
                <div class="profile-name">MR. PIPOOH</div>
                <div class="profile-badge">AUTHORIZED CLASS-A</div>
            </div>

            <!-- Dynamic Holographic Calendar Widget -->
            <div class="widget-card">
                <div class="widget-header">
                    <i class="fas fa-calendar-alt"></i> CALENDAR
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar days auto generated by JS -->
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-home"></i>
                <span>หน้าหลัก</span>
            </div>
            <div class="nav-item" onclick="toggleVoiceRecognition()">
                <i class="fas fa-comment-dots"></i>
                <span>สนทนา</span>
            </div>
            <div class="nav-item" onclick="openSettings()">
                <i class="fas fa-sliders-h"></i>
                <span>ตั้งค่า</span>
            </div>
        </div>

        <!-- Settings Modal Window -->
        <div class="settings-modal" id="settingsModal">
            <div class="settings-header">
                <h3>SETTINGS</h3>
                <i class="fas fa-times" style="cursor: pointer;" onclick="closeSettings()"></i>
            </div>
            <div class="input-group">
                <label>GEMINI API KEY:</label>
                <input type="password" id="apiKeyInput" placeholder="วาง API Key ที่นี่...">
            </div>
            <div class="input-group">
                <label>เลือกเสียงโต้ตอบ (VOICE SELECT):</label>
                <select id="voiceSelect"></select>
            </div>
            <button style="padding: 10px; background: var(--primary-mint); border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="saveSettings()">บันทึกการตั้งค่า</button>
        </div>
    </div>

    <script>
        // --- 1. Real-Time Clock & Dynamic Calendar Generator ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH');
            document.getElementById('date').innerText = now.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const now = new Date();
            const days = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
            
            grid.innerHTML = days.map(d => `<div class="cal-day-head">${d}</div>`).join('');
            
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
            const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const isToday = day === now.getDate() ? 'active' : '';
                grid.innerHTML += `<div class="cal-date ${isToday}">${day}</div>`;
            }
        }
        renderCalendar();

        // --- 2. Deep Space Stars Canvas ---
        const starCanvas = document.getElementById('space-stars');
        const starCtx = starCanvas.getContext('2d');
        let stars = [];

        function resizeStarCanvas() {
            starCanvas.width = starCanvas.parentElement.clientWidth;
            starCanvas.height = starCanvas.parentElement.clientHeight;
        }
        resizeStarCanvas();

        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * starCanvas.width,
                y: Math.random() * starCanvas.height,
                size: Math.random() * 1.5,
                alpha: Math.random(),
                speed: 0.005 + Math.random() * 0.015
            });
        }

        function drawStars() {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                starCtx.fillStyle = `rgba(0, 255, 204, ${Math.abs(star.alpha)})`;
                starCtx.beginPath();
                starCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                starCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // --- 3. Three.js 3D Floating Hologram Sphere ---
        const container = document.getElementById('hologram-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Particle Sphere Object
        const geometry = new THREE.SphereGeometry(2.2, 48, 48);
        const count = geometry.attributes.position.count;
        const colors = [];
        const colorMint = new THREE.Color('#00ffcc');
        const colorCyan = new THREE.Color('#00d8ff');

        for (let i = 0; i < count; i++) {
            const mixedColor = Math.random() > 0.5 ? colorMint : colorCyan;
            colors.push(mixedColor.r, mixedColor.g, mixedColor.b);
        }
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            transparent: true,
            opacity: 0.85
        });

        const orbSphere = new THREE.Points(geometry, material);
        scene.add(orbSphere);

        // Inner Glowing Core
        const coreGeo = new THREE.IcosahedronGeometry(1.2, 2);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            wireframe: true,
            transparent: true,
            opacity: 0.35
        });
        const orbCore = new THREE.Mesh(coreGeo, coreMat);
        scene.add(orbCore);

        camera.position.z = 5.5;

        // 3D Animation Loop
        function animate3D() {
            requestAnimationFrame(animate3D);
            orbSphere.rotation.y += 0.005;
            orbSphere.rotation.x += 0.002;
            orbCore.rotation.y -= 0.008;
            renderer.render(scene, camera);
        }
        animate3D();

        // --- 4. Web Speech API & Voice Interaction ---
        let recognition;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                processVoiceCommand(text);
            };

            recognition.onend = function() {
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
            };
        }

        function toggleVoiceRecognition() {
            if (!recognition) {
                alert("เบราว์เซอร์ไม่รองรับการสั่งงานด้วยเสียง");
                return;
            }
            if (!isListening) {
                recognition.start();
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
            } else {
                recognition.stop();
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
            }
        }

        function processVoiceCommand(cmd) {
            if (cmd.includes('เปิด YouTube') || cmd.includes('ยูทูป')) {
                speakText("รับทราบครับคุณ PIPOOH กำลังเปิด YouTube ให้ครับ");
                window.open('https://www.youtube.com', '_blank');
            } else {
                speakText(`รับทราบครับคุณ PIPOOH สั่งว่า ${cmd}`);
            }
        }

        function speakText(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'th-TH';
            synth.speak(utter);
        }

        // --- 5. Settings Modal Controls ---
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }
        function saveSettings() {
            closeSettings();
            speakText("บันทึกการตั้งค่าเรียบร้อยแล้วครับคุณ PIPOOH");
        }
    </script>
</body>
</html>
